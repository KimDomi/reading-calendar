<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#55555e"><meta name="description" content="목표일은 내가 정하고, 독서 일정은 달력이 계산합니다."><style>:root{color-scheme:light;background:#f0f0f3}:root[data-theme=dark]{color-scheme:dark;background:#141416}@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;background:#141416}}</style>
<script>
(()=>{let mode='system';try{const saved=JSON.parse(localStorage.getItem('reading-calendar-settings-v1'));if(['light','dark','system'].includes(saved?.theme))mode=saved.theme;}catch{}
const dark=mode==='dark'||(mode==='system'&&typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=dark?'dark':'light';
document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#1c1c1e':'#fafafa');})();
</script>
